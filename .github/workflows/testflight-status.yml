name: TestFlight status

# Reports whether Apple has finished processing Atturel's newest TestFlight
# build (or a given build number), and the internal testing groups. Waits for
# processing if it is still running. Uses the same App Store Connect key
# secrets as the iOS TestFlight workflow. "Crash reports" also prints the crash
# logs testers shared. Read-only unless "invite team admins" is ticked: then an
# empty internal group gets the team's Account Holder and Admins.

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: Build number to check (leave empty for the newest)
        required: false
        default: ''
      wait_minutes:
        description: Minutes to wait for Apple's processing
        required: false
        default: '30'
      invite_team_admins:
        description: If the internal group is empty, invite the team's Account Holder and Admins
        type: boolean
        default: false
      crash_reports:
        description: Also print the crash reports testers shared from TestFlight
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  status:
    name: Check TestFlight
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Find the App Store Connect key
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_KEY_ISSUER_ID: ${{ secrets.ASC_API_KEY_ISSUER_ID }}
        run: node scripts/ci/asc-setup.cjs

      - name: Crash reports shared from TestFlight
        if: inputs.crash_reports
        run: node scripts/ci/testflight-crashes.cjs

      - name: TestFlight status
        env:
          BUILD_NUMBER: ${{ inputs.build_number }}
          TESTFLIGHT_WAIT_MINUTES: ${{ inputs.wait_minutes }}
          INVITE_TEAM_ADMINS: ${{ inputs.invite_team_admins }}
        run: node scripts/ci/testflight-status.cjs
