name: TestFlight status

# Reports whether Apple has finished processing Atturel's newest TestFlight
# build (or a given build number), and the internal testing groups. Waits for
# processing if it is still running. Uses the same App Store Connect key
# secrets as the iOS TestFlight workflow. "Crash reports" also prints the crash
# logs testers shared. Read-only unless "invite team admins" is ticked: then an
# empty internal group gets the team's Account Holder and Admins.
#
# "External action" runs one external TestFlight step for the given build
# (scripts/ci/testflight-external.cjs): prepare the "Atturel Pilot" group and
# its information, verify the reviewer sign-in, submit for beta review, or turn
# on the public link once approved. Left at "none", nothing external changes.

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: Build number to check (leave empty for the newest)
        required: false
        default: ''
      wait_minutes:
        description: Minutes to wait for Apple's processing
        required: false
        default: '30'
      invite_team_admins:
        description: If the internal group is empty, invite the team's Account Holder and Admins
        type: boolean
        default: false
      crash_reports:
        description: Also print the crash reports testers shared from TestFlight
        type: boolean
        default: false
      external_action:
        description: External TestFlight step for the build above
        type: choice
        options: [none, prepare, verify, submit, public-link]
        default: none
      rotate_demo_password:
        description: With "prepare", replace the reviewer password App Store Connect holds
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  status:
    name: Check TestFlight
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Find the App Store Connect key
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_KEY_ISSUER_ID: ${{ secrets.ASC_API_KEY_ISSUER_ID }}
        run: node scripts/ci/asc-setup.cjs

      - name: Crash reports shared from TestFlight
        if: inputs.crash_reports
        run: node scripts/ci/testflight-crashes.cjs

      - name: TestFlight status
        env:
          BUILD_NUMBER: ${{ inputs.build_number }}
          TESTFLIGHT_WAIT_MINUTES: ${{ inputs.wait_minutes }}
          INVITE_TEAM_ADMINS: ${{ inputs.invite_team_admins }}
        run: node scripts/ci/testflight-status.cjs

      # Hashes a new reviewer password in "prepare"; kept out of the app's dependencies.
      - name: Install bcryptjs
        if: inputs.external_action == 'prepare'
        run: npm install --prefix "$RUNNER_TEMP/bcryptjs" --no-save --no-package-lock --no-audit --no-fund bcryptjs@2.4.3

      - name: External TestFlight
        if: inputs.external_action != 'none'
        env:
          BUILD_NUMBER: ${{ inputs.build_number }}
          TESTFLIGHT_ACTION: ${{ inputs.external_action }}
          ROTATE_DEMO_PASSWORD: ${{ inputs.rotate_demo_password }}
          BCRYPTJS_DIR: ${{ runner.temp }}/bcryptjs
        run: node scripts/ci/testflight-external.cjs
