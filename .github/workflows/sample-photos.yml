name: Sample photos

# Generates candidate photo portraits for the five fictional sample people
# (scripts/brand/sample-photos.py) and commits them to the branch it ran on.

on:
  push:
    branches: [feat/sample-photos]
    paths: [scripts/brand/sample-photos.py, .github/workflows/sample-photos.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install gradio_client
      - run: python scripts/brand/sample-photos.py brand/sample-photos-raw 3
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add brand/sample-photos-raw
          git commit -m "Sample photo candidates" || echo nothing
          git push
